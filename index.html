<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>なぞときのじかん ヒント</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fcf3e4;
    --card: #ffffff;
    --ink: #3a3631;
    --muted: #7b7369;
    --gold: #b38a4c;
    --gold-soft: #e6d3b3;
    --leaf: #4a6b3a;
    --row-a: #e3e1dd;
    --row-b: #ffffff;
    --hint: #f4efe4;
    --answer: #4f6e43;
    --red: #c9573f;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Zen Maru Gothic", system-ui, sans-serif; font-weight: 500;
    font-size: 16px; line-height: 1.75;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 16px 16px 56px; }

  /* 見出し（紙のヒントシートの額縁＋月桂樹） */
  .frame {
    position: relative; background: var(--card); margin: 8px 0 20px;
    border: 2px solid var(--gold); outline: 1px solid var(--gold); outline-offset: -7px;
    padding: 26px 56px 22px; text-align: center;
  }
  .frame::before, .frame::after, .frame .c3, .frame .c4 {
    content: ""; position: absolute; width: 14px; height: 14px;
    border: 2px solid var(--gold); border-radius: 50%; background: var(--card);
  }
  .frame::before { top: -8px; left: -8px; }
  .frame::after { top: -8px; right: -8px; }
  .frame .c3 { bottom: -8px; left: -8px; }
  .frame .c4 { bottom: -8px; right: -8px; }
  .laurel { position: absolute; top: 14px; bottom: 14px; width: 40px; }
  .laurel.l { left: 10px; }
  .laurel.r { right: 10px; transform: scaleX(-1); }
  .laurel svg { width: 100%; height: 100%; }
  .couple { font-family: "Shippori Mincho", serif; color: var(--gold); letter-spacing: .14em; font-size: 13px; }
  h1 { font-family: "Shippori Mincho", serif; font-weight: 800; font-size: clamp(20px, 6.2vw, 28px); margin: 2px 0 0; letter-spacing: .04em; white-space: nowrap; }
  .sub { display: inline-block; margin-top: 8px; padding: 2px 16px; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); font-weight: 700; letter-spacing: .2em; font-size: 15px; }
  .date { color: var(--muted); font-size: 12px; letter-spacing: .2em; margin-top: 8px; }

  .lead { text-align: center; font-weight: 700; font-size: 14px; white-space: pre-line; margin: 0 0 6px; }
  .how { text-align: center; color: var(--muted); font-size: 13px; margin: 0 0 18px; }

  nav.steps { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; padding: 8px 0; background: var(--paper); }
  nav.steps a {
    flex: 1; text-align: center; text-decoration: none; color: var(--ink); background: var(--card);
    border: 1px solid var(--ink); padding: 4px 0; font-size: 13px; font-weight: 700; letter-spacing: .04em;
  }

  /* 表（紙のヒントシートの行） */
  section.group { scroll-margin-top: 56px; margin: 18px 0 0; }
  .gnote { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  .table { border: 1px solid #bdb9b2; }
  details.row { border-top: 1px solid #bdb9b2; }
  details.row:first-child { border-top: none; }
  details.row:nth-child(odd) > summary { background: var(--row-a); }
  details.row:nth-child(even) > summary { background: var(--row-b); }
  details.row > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; min-height: 56px; -webkit-tap-highlight-color: transparent;
  }
  details.row > summary::-webkit-details-marker { display: none; }
  .tag { flex: 0 0 auto; border: 1px solid var(--ink); background: #fff; font-size: 11px; line-height: 1; padding: 4px 6px; letter-spacing: .04em; font-family: system-ui, sans-serif; }
  .letter { flex: 0 0 auto; min-width: 26px; text-align: center; font-family: "Shippori Mincho", serif; font-weight: 800; font-size: 20px; }
  .letter.wide { font-size: 15px; min-width: 52px; }
  .rtitle { flex: 1; font-size: 14px; }
  .state { flex: 0 0 auto; font-size: 11px; color: var(--muted); }
  .state.done { color: var(--answer); font-weight: 700; }
  .chev { flex: 0 0 auto; color: var(--muted); transition: transform .2s; font-size: 18px; }
  details[open] .chev { transform: rotate(90deg); }

  .body { background: var(--hint); padding: 12px 12px 14px; border-top: 1px dashed #cfc6b5; }
  .hint { position: relative; background: #fff; border: 1px solid var(--gold-soft); padding: 8px 12px 10px; margin: 0 0 8px; }
  .hint b { display: block; color: var(--gold); font-size: 12px; letter-spacing: .1em; }
  .answer { border: 2px solid var(--answer); background: #fff; padding: 10px 12px 12px; text-align: center; }
  .answer b { display: block; color: var(--answer); font-size: 12px; letter-spacing: .1em; margin-bottom: 6px; }
  .boxes { display: inline-flex; flex-wrap: nowrap; justify-content: center; }
  .box { position: relative; width: clamp(28px, 8.4vw, 38px); height: clamp(34px, 10vw, 42px); border: 1px solid #8a847b; margin-left: -1px; display: grid; place-items: center; font-size: 20px; font-weight: 700; background: #fff; }
  .box i { position: absolute; right: 3px; bottom: 0; font-style: normal; font-size: 10px; font-weight: 500; color: var(--ink); }
  .plain { font-size: 20px; font-weight: 700; letter-spacing: .12em; }
  .anote { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .final-note { text-align: center; color: var(--red); font-weight: 700; margin-top: 4px; }
  button {
    font: inherit; font-weight: 700; font-size: 15px; width: 100%; min-height: 46px; cursor: pointer;
    border: 1px solid var(--gold); background: #fff; color: var(--gold); border-radius: 999px;
  }
  button.ans { border-color: var(--answer); color: var(--answer); }
  button.ans.confirm { background: var(--answer); color: #fff; }

  .reset { background: none; border: none; color: var(--muted); font-size: 13px; text-decoration: underline; margin-top: 32px; min-height: 0; font-weight: 500; }
  footer { text-align: center; font-weight: 700; margin-top: 28px; white-space: pre-line; }

  .closed { text-align: center; padding: 28px 0; color: var(--muted); }
  .closed .big { font-family: "Shippori Mincho", serif; font-weight: 800; font-size: 22px; color: var(--ink); margin-bottom: 6px; }
  .preview-bar { background: var(--gold); color: #fff; text-align: center; font-size: 13px; padding: 6px; }
  @media (max-width: 400px) { .frame { padding: 22px 42px 18px; } .laurel { width: 30px; left: 6px; } .laurel.r { right: 6px; left: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="hints.js"></script>
<script>
(() => {
  const C = window.HINT_CONFIG, STEPS = window.HINT_STEPS;
  const app = document.getElementById("app");
  const preview = new URLSearchParams(location.search).has("preview");
  const isOpen = preview || Date.now() >= new Date(C.openAt).getTime();

  const KEY = "hint-progress-v2";
  let state = {};
  try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // 月桂樹の枝（紙のヒントシートの飾りを模したもの）
  const leaf = (y, s) => `<ellipse cx="${s * 9}" cy="${y}" rx="8" ry="3.4" transform="rotate(${s * -35} ${s * 9} ${y})"/>`;
  let leaves = "";
  for (let y = 14; y <= 132; y += 15) leaves += leaf(y, -1) + leaf(y + 7, 1);
  const laurel = `<svg viewBox="-20 0 40 150" fill="var(--leaf)" aria-hidden="true"><path d="M0 4 Q-6 75 6 146" stroke="var(--leaf)" stroke-width="1.6" fill="none"/><g transform="translate(0 0)">${leaves}</g></svg>`;

  const head = `
    ${preview ? '<div class="preview-bar">プレビュー表示中（公開前でも中身が見えます）</div>' : ""}
    <div class="wrap">
      <div class="frame"><i class="c3"></i><i class="c4"></i>
        <div class="laurel l">${laurel}</div><div class="laurel r">${laurel}</div>
        <div class="couple">${esc(C.couple)}</div>
        <h1>${esc(C.title)}</h1>
        <div class="sub">${esc(C.subtitle)}</div>
        <div class="date">${esc(C.date)}</div>
      </div>`;

  if (!isOpen) {
    app.innerHTML = head + `<div class="closed"><div class="big">当日公開</div>披露宴の当日に、このページでヒントを公開します。<br>当日までお楽しみに！</div></div>`;
    return;
  }

  const rowHtml = (g, q) => `
    <details class="row" data-id="${q.id}">
      <summary>
        <span class="tag">${esc(g.title.replace(" ", ""))}</span>
        <span class="letter${q.label.length > 1 ? " wide" : ""}">${esc(q.label)}</span>
        <span class="rtitle">${esc(q.title || "")}</span>
        <span class="state"></span>
        <span class="chev">›</span>
      </summary>
      <div class="body"></div>
    </details>`;

  app.innerHTML = head + `
      <p class="lead">${esc(C.lead)}</p>
      <p class="how">わからない謎をタップ →「ヒントを見る」。答えは最後に表示されます。</p>
      <nav class="steps">${STEPS.map((g) => `<a href="#${g.id}">${esc(g.title)}</a>`).join("")}</nav>
      ${STEPS.map((g) => `
        <section class="group" id="${g.id}">
          ${g.note ? `<p class="gnote">${esc(g.note)}</p>` : ""}
          <div class="table">${g.questions.map((q) => rowHtml(g, q)).join("")}</div>
        </section>`).join("")}
      <footer>${esc(C.footer)}</footer>
      <div style="text-align:center"><button class="reset" id="reset">見たヒントの記録をリセット</button></div>
    </div>`;

  const byId = {};
  STEPS.forEach((g) => g.questions.forEach((q) => (byId[q.id] = q)));

  const answerHtml = (q) => {
    const chars = Array.from(q.answer);
    const inner = q.nums
      ? `<span class="boxes">${chars.map((c, i) => `<span class="box">${esc(c)}${q.nums[i] ? `<i>${q.nums[i]}</i>` : ""}</span>`).join("")}</span>`
      : `<span class="plain">${esc(q.answer)}</span>`;
    const note = q.nums ? `<div class="anote">右下の番号の文字を STEP 2 に書き込もう</div>` : "";
    return `<div class="answer"><b>答え</b>${inner}${note}</div>`;
  };

  function render(el) {
    const q = byId[el.dataset.id];
    const st = state[q.id] || { shown: 0, ans: false };
    let html = "";
    for (let i = 0; i < st.shown; i++) html += `<div class="hint"><b>ヒント ${i + 1}</b>${esc(q.hints[i])}</div>`;
    if (st.ans) html += answerHtml(q);
    else if (st.shown < q.hints.length) html += `<button data-act="hint">ヒント ${st.shown + 1} を見る</button>`;
    else if (q.answer) html += `<button class="ans" data-act="ans">答えを見る</button>`;
    else html += `<p class="final-note">答えがわかったら、新郎新婦に伝えてね！</p>`;
    el.querySelector(".body").innerHTML = html;
    const s = el.querySelector(".state");
    s.className = "state" + (st.ans ? " done" : "");
    s.textContent = st.ans ? "答え表示済" : st.shown ? `ヒント ${st.shown}/${q.hints.length}` : "";
  }

  document.querySelectorAll("details.row").forEach((el) => {
    render(el);
    el.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      const id = el.dataset.id;
      const st = state[id] || { shown: 0, ans: false };
      if (b.dataset.act === "hint") st.shown++;
      if (b.dataset.act === "ans") {
        if (!b.classList.contains("confirm")) {
          b.classList.add("confirm");
          b.textContent = "本当に答えを見る？（もう一度タップ）";
          return;
        }
        st.ans = true;
      }
      state[id] = st; save(); render(el);
    });
  });

  document.getElementById("reset").addEventListener("click", () => {
    if (!confirm("見たヒントの記録を消しますか？")) return;
    state = {}; save();
    document.querySelectorAll("details.row").forEach((el) => { el.open = false; render(el); });
  });
})();
</script>
</body>
</html>
