<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>謎解きヒント</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f1;
    --card: #ffffff;
    --ink: #2f3a33;
    --muted: #6f7a72;
    --line: #e4ddd0;
    --accent: #5f7f63;
    --accent-soft: #e9f0e6;
    --warm: #c9824a;
    --warm-soft: #f8ebdf;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
    font-size: 17px; line-height: 1.75;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 64px; }
  header { text-align: center; padding: 40px 0 24px; }
  .couple { font-family: "Shippori Mincho", serif; letter-spacing: .12em; color: var(--accent); font-size: 14px; }
  h1 { font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 30px; margin: 6px 0 4px; letter-spacing: .08em; }
  .date { color: var(--muted); font-size: 13px; letter-spacing: .2em; }
  .lead { white-space: pre-line; margin: 20px 0 0; font-size: 15px; color: var(--muted); }
  .how { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 14px; color: var(--muted); margin-bottom: 28px; }
  .how b { color: var(--ink); }

  nav.steps { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; padding: 10px 0; background: var(--bg); overflow-x: auto; }
  nav.steps a {
    flex: 1 0 auto; text-align: center; text-decoration: none; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 500;
  }
  section.step { scroll-margin-top: 64px; margin-top: 24px; }
  section.step > h2 { font-family: "Shippori Mincho", serif; font-size: 22px; margin: 0; letter-spacing: .08em; }
  section.step > p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }

  details.q { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin: 10px 0; overflow: hidden; }
  details.q > summary {
    list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    min-height: 56px; -webkit-tap-highlight-color: transparent;
  }
  details.q > summary::-webkit-details-marker { display: none; }
  .badge {
    flex: 0 0 auto; min-width: 36px; height: 36px; padding: 0 8px; border-radius: 18px; background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-weight: 700; font-family: "Shippori Mincho", serif;
  }
  .qtitle { flex: 1; font-weight: 500; }
  .progress { font-size: 12px; color: var(--muted); }
  .chev { color: var(--muted); transition: transform .2s; }
  details[open] .chev { transform: rotate(90deg); }
  .body { padding: 0 16px 16px; }
  .hint { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 12px; border-radius: 0 10px 10px 0; margin: 8px 0; white-space: pre-line; }
  .hint small { display: block; color: var(--accent); font-weight: 700; font-size: 12px; }
  .answer { border-left-color: var(--warm); background: var(--warm-soft); }
  .answer small { color: var(--warm); }
  button {
    font: inherit; font-size: 15px; width: 100%; min-height: 48px; margin-top: 8px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--card); color: var(--accent); font-weight: 500;
  }
  button.ans { border-color: var(--warm); color: var(--warm); }
  button.ans.confirm { background: var(--warm); color: #fff; }
  .reset { background: none; border: none; color: var(--muted); font-size: 13px; text-decoration: underline; margin-top: 40px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 40px; }

  .closed { text-align: center; padding: 48px 0; color: var(--muted); }
  .closed .big { font-family: "Shippori Mincho", serif; font-size: 22px; color: var(--ink); margin-bottom: 8px; }
  .preview-bar { background: var(--warm); color: #fff; text-align: center; font-size: 13px; padding: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="hints.js"></script>
<script>
(() => {
  const C = window.HINT_CONFIG, STEPS = window.HINT_STEPS;
  const app = document.getElementById("app");
  const params = new URLSearchParams(location.search);
  const preview = params.has("preview");
  const isOpen = preview || Date.now() >= new Date(C.openAt).getTime();
  document.title = C.title;

  const KEY = "hint-progress-v1";
  let state = {};
  try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const head = `
    ${preview ? '<div class="preview-bar">プレビュー表示中（公開前でも中身が見えます）</div>' : ""}
    <div class="wrap"><header>
      <div class="couple">${esc(C.couple)}</div>
      <h1>${esc(C.title)}</h1>
      <div class="date">${esc(C.date)}</div>
      ${isOpen ? `<p class="lead">${esc(C.lead)}</p>` : ""}
    </header>`;

  if (!isOpen) {
    app.innerHTML = head + `<div class="closed"><div class="big">当日公開</div>披露宴の当日にこのページでヒントを公開します。<br>当日までお楽しみに。</div></div>`;
    return;
  }

  const qHtml = (q) => `
    <details class="q" data-id="${q.id}">
      <summary>
        <span class="badge">${esc(q.label)}</span>
        <span class="qtitle">${esc(q.title || "")}</span>
        <span class="progress"></span>
        <span class="chev">›</span>
      </summary>
      <div class="body"></div>
    </details>`;

  app.innerHTML = head + `
    <div class="how"><b>使い方</b>　わからない謎をタップ → 「ヒント1を見る」。それでもわからなければ次のヒントへ。答えは最後の手段です。</div>
    <nav class="steps">${STEPS.map((s) => `<a href="#${s.id}">${esc(s.title)}</a>`).join("")}</nav>
    ${STEPS.map((s) => `
      <section class="step" id="${s.id}">
        <h2>${esc(s.title)}</h2>
        ${s.note ? `<p>${esc(s.note)}</p>` : ""}
        ${s.questions.map(qHtml).join("")}
      </section>`).join("")}
    <button class="reset" id="reset">見たヒントの記録をリセット</button>
    <footer>本日はご列席いただき、ありがとうございます。</footer>
  </div>`;

  const byId = {};
  STEPS.forEach((s) => s.questions.forEach((q) => (byId[q.id] = q)));

  function render(el) {
    const q = byId[el.dataset.id];
    const st = state[q.id] || { shown: 0, ans: false };
    const body = el.querySelector(".body");
    let html = "";
    for (let i = 0; i < st.shown; i++) html += `<div class="hint"><small>ヒント${i + 1}</small>${esc(q.hints[i])}</div>`;
    if (st.ans) html += `<div class="hint answer"><small>答え</small>${esc(q.answer)}</div>`;
    else if (st.shown < q.hints.length) html += `<button data-act="hint">ヒント${st.shown + 1}を見る</button>`;
    else if (q.answer) html += `<button class="ans" data-act="ans">答えを見る</button>`;
    body.innerHTML = html;
    const total = q.hints.length;
    el.querySelector(".progress").textContent = st.ans ? "答え表示済" : st.shown ? `ヒント ${st.shown}/${total}` : "";
  }

  document.querySelectorAll("details.q").forEach((el) => {
    render(el);
    el.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      const id = el.dataset.id;
      const st = state[id] || { shown: 0, ans: false };
      if (b.dataset.act === "hint") st.shown++;
      if (b.dataset.act === "ans") {
        if (!b.classList.contains("confirm")) {
          b.classList.add("confirm");
          b.textContent = "本当に答えを見る？（もう一度タップ）";
          return;
        }
        st.ans = true;
      }
      state[id] = st; save(); render(el);
    });
  });

  document.getElementById("reset").addEventListener("click", () => {
    if (!confirm("見たヒントの記録を消しますか？")) return;
    state = {}; save();
    document.querySelectorAll("details.q").forEach((el) => { el.open = false; render(el); });
  });
})();
</script>
</body>
</html>
